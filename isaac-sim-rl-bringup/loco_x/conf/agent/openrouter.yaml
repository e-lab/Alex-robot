# @package agent
# OpenRouter — matches cap-x's default provider plumbing.

enabled: true
provider: openrouter
model: anthropic/claude-opus-4.7
tick_hz: 2.0
max_turns: 20
exec_timeout_s: 5.0
obs_radius_m: 5.0
obs_recency_s: 30.0
obs_max_nodes: 20

vlm_enabled: true
vlm_provider: openrouter
vlm_model: openai/gpt-4o
vlm_max_calls_per_task: 5
vlm_cache_window_s: 10.0

survey_angles_deg: [-60, -30, 0, 30, 60, 90]
survey_quick_angles_deg: [-45, 0, 45]
